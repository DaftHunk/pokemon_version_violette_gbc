<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte interactive — de Bourg Palette au Plateau Indigo</title>
<style>
  :root {
    --bg: #10162b;
    --panel: #182138;
    --panel2: #1e2a47;
    --text: #e8ecf8;
    --muted: #94a3c4;
    --accent: #8f7ff0;
    --trainer: #e3350d;
    --item: #2e9e4f;
    --gift: #f47d40;
    --hidden: #f0b429;
    --warp: #4c9af5;
    --npc: #45c7b8;
    --vendor: #ffd700;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    padding: 10px 16px;
    background: linear-gradient(180deg, #1b2445, #141b32);
    border-bottom: 1px solid #2c3a63;
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: 0.3px; }
  header h1 .pkm { color: var(--accent); }
  header .proto {
    font-size: 11px; color: #ffd36e; border: 1px solid #6b5a1e;
    background: #2b2410; border-radius: 10px; padding: 2px 8px;
  }
  #pages { display: flex; align-items: center; gap: 6px; align-self: center; margin-left: auto; }
  #paneltoggle .car { font-size: 11px; }
  #pages > button, .dd > button {
    font-size: 12.5px; padding: 4px 12px; border-radius: 8px; border: 1px solid #33436e;
    background: var(--panel); color: var(--text); cursor: pointer;
  }
  #pages > button:hover, .dd > button:hover, .dd.open > button { background: var(--panel2); }
  #pages > button.active, .dd > button.active {
    background: var(--accent); border-color: var(--accent); color: #141b32; font-weight: 700;
  }
  .dd { position: relative; }
  .dd .car { font-size: 9px; }
  .ddmenu {
    display: none; position: absolute; top: 100%; left: 0; margin-top: 6px;
    min-width: 240px; background: var(--panel2); border: 1px solid #3a4a7e;
    border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.55);
    padding: 4px; z-index: 60;
  }
  .dd.open .ddmenu { display: block; }
  #pages .ddmenu { left: auto; right: 0; }
  .ddmenu .grp {
    display: block; width: 100%; text-align: left; font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.8px; color: var(--text);
    padding: 6px 8px; margin: 4px 0 0; border: none; background: none; cursor: pointer;
    border-radius: 6px;
  }
  .ddmenu .grp:hover { background: #2a3760; }
  .ddmenu .grp.active { color: #ffd36e; }

  .ddmenu .kitem {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    font-size: 12px; font-weight: 600; color: var(--text); padding: 5px 8px;
    margin: 1px 0 0; border: none; background: none; cursor: pointer;
    border-radius: 6px; text-transform: none; letter-spacing: 0;
  }
  .ddmenu .kitem:hover { background: #2a3760; }
  /* Pastille des icônes d'objets clés, même badge que les giveico :
     22 px au total (icône 16 + padding 2 + bordure 1), box-sizing:
     content-box car le global est en border-box. */
  .ddmenu .kitem img { width: 16px; height: 16px; image-rendering: pixelated; flex: none;
    background: #ffffff; border-radius: 999px; padding: 2px; box-sizing: content-box;
    border: 1px solid rgba(0,0,0,0.75); box-shadow: 0 1px 4px rgba(0,0,0,0.6); }
  #dd-objets .ddmenu { max-height: 75vh; overflow-y: auto; }
  body.nospoil #dd-succes { display: none; }
  #layout { display: flex; flex: 1; min-height: 0; }
  #viewport {
    flex: 1; position: relative; overflow: hidden; cursor: grab;
    background:
      repeating-conic-gradient(#0c1122 0% 25%, #0e1428 0% 50%) 0 0 / 24px 24px;
    touch-action: none;
  }
  #viewport.dragging { cursor: grabbing; }
  #stage { position: absolute; transform-origin: 0 0; }
  #viewport, #viewport * { user-select: none; -webkit-user-select: none; }
  .page { position: absolute; left: 0; top: 0; }
  .maplayer { position: absolute; }
  .maplayer img { image-rendering: pixelated; display: block; user-select: none; width: 100%; height: 100%; }
  .maplayer.sel { box-shadow: 0 0 0 2px var(--accent); }
  /* Les calques de type ne captent pas les clics : sans ça, les types
     créés plus tard dans l'ordre de la légende (item, hidden, warp)
     couvriraient les marqueurs des types créés avant (pnj, vendeur,
     trainer) et bloqueraient leur sélection. */
  .mtype { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  .mtype .marker { pointer-events: auto; }
  .marker {
    position: absolute; width: 0; height: 0; cursor: pointer; z-index: 4;
  }
  .marker img.spr {
    position: absolute; width: 32px; height: 32px;
    left: -16px; top: -28px;
    image-rendering: pixelated;
    transform: scale(calc(1 / var(--z, 1)));
    transform-origin: 16px 32px;
  }
  .marker img.spr.trainer { filter: drop-shadow(0 0 8px var(--trainer)) drop-shadow(0 1px 1px rgba(0,0,0,0.5)); }
  .marker img.spr.gift { filter: drop-shadow(0 0 8px var(--gift)) drop-shadow(0 1px 1px rgba(0,0,0,0.5)); }
  .marker img.spr.item { filter: drop-shadow(0 0 8px var(--item)) drop-shadow(0 1px 1px rgba(0,0,0,0.5)); }
  .marker img.spr.pnj { filter: drop-shadow(0 0 2px var(--npc)) drop-shadow(0 1px 1px rgba(0,0,0,0.5)); }
  .marker img.spr.vendeur { filter: drop-shadow(0 0 8px var(--vendor)) drop-shadow(0 1px 1px rgba(0,0,0,0.5)); }
  /* Pastilles 1px pleines et pivots des contre-échelles collés au pied
     du sprite, exactement comme img.spr : chaque pastille garde une
     position fixe par rapport à son PNJ à tout niveau de zoom. */
  .marker .hiddenico {
    position: absolute; left: -4px; top: -10px;
    width: 22px; height: 22px; border-radius: 999px;
    background: var(--hidden); border: 1px solid rgba(0,0,0,0.75);
    border-style: solid; box-shadow: 0 1px 4px rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    transform: scale(calc(1 / var(--z, 1)));
    transform-origin: 6px 14px;
  }
  .marker .hiddenico img { width: 16px; height: 16px; image-rendering: pixelated; }
  .marker .giveico {
    position: absolute; left: -4px; top: -10px;
    width: 22px; height: 22px; border-radius: 999px;
    background: #ffffff; border: 1px solid rgba(0,0,0,0.75);
    border-style: solid; box-shadow: 0 1px 4px rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    transform: scale(calc(1 / var(--z, 1)));
    transform-origin: 6px 14px;
    pointer-events: none;
  }
  .marker .giveico img { width: 16px; height: 16px; image-rendering: pixelated; }
  .marker .ballico {
    position: absolute; left: -4px; top: -10px;
    width: 22px; height: 22px; border-radius: 999px;
    background: #ffffff; border: 1px solid rgba(0,0,0,0.75);
    box-shadow: 0 1px 4px rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    transform: scale(calc(1 / var(--z, 1)));
    transform-origin: 6px 14px;
    pointer-events: none;
  }
  .marker .ballico img { width: 16px; height: 16px; image-rendering: pixelated; }
  .marker .shopico {
    position: absolute; left: -4px; top: -10px;
    width: 22px; height: 22px; border-radius: 999px;
    background: #f7d24a; border: 1px solid rgba(0,0,0,0.75);
    border-style: solid; box-shadow: 0 1px 4px rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    transform: scale(calc(1 / var(--z, 1)));
    transform-origin: 6px 14px;
    pointer-events: none;
  }
  .marker .shopico img { width: 16px; height: 16px; image-rendering: pixelated; }
  .marker .hitrond {
    position: absolute; left: -4px; top: -10px;
    width: 26px; height: 26px; border-radius: 999px; box-sizing: border-box;
    background: transparent; border: 2px solid transparent;
    transform: scale(calc(1 / var(--z, 1)));
    transform-origin: 6px 14px;
  }
  .marker:hover .hitrond { border-color: rgba(255,215,0,0.65); }
  .marker.sel .hitrond { border-color: #fff; }
  .marker.sel img.spr { filter: drop-shadow(0 0 8px #fff) drop-shadow(0 1px 2px rgba(0,0,0,0.6)); }
  .marker .badge {
    position: absolute; transform: translate(-50%, -50%) scale(calc(1 / var(--z, 1)));
    min-width: 22px; height: 22px; padding: 0 4px;
    border-radius: 999px; display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #fff;
    border: 2px solid rgba(0,0,0,0.75);
    box-shadow: 0 1px 4px rgba(0,0,0,0.6);
    transition: box-shadow 0.1s;
    white-space: nowrap;
  }
  .marker:hover { z-index: 5; }
  .marker:hover .badge { box-shadow: 0 0 0 3px rgba(255,255,255,0.35), 0 1px 4px rgba(0,0,0,0.6); }
  .marker.sel { z-index: 6; }
  .marker.sel .badge { box-shadow: 0 0 0 3px #fff, 0 1px 6px rgba(0,0,0,0.8); }
  .badge.trainer { background: var(--trainer); }
  .badge.item    { background: var(--item); }
  .badge.gift    { background: var(--gift); }
  .badge.hidden  { background: var(--hidden); color: #3a2c05; border-style: dashed; }
  .badge.warp    { background: var(--warp); font-size: 9px; }
  .badge.pnj     { background: var(--npc); font-size: 9px; }
  #zoombar {
    position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; z-index: 10;
  }
  #zoombar button {
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid #33436e;
    background: var(--panel); color: var(--text); font-size: 15px; cursor: pointer;
  }
  #zoombar button:hover { background: var(--panel2); }
  #zoombar .fit { width: auto; padding: 0 10px; font-size: 12px; }
  #zoomlevel {
    position: absolute; bottom: 10px; left: 10px; z-index: 10;
    background: rgba(10,15,30,0.8); color: var(--muted);
    font-size: 11px; padding: 3px 8px; border-radius: 8px;
  }
  aside#panel {
    width: 320px; flex: none; background: var(--panel);
    border-left: 1px solid #2c3a63; display: flex; flex-direction: column;
    overflow-y: auto;
  }
  body.panelhide aside#panel { display: none; }
  .section { padding: 12px 14px; border-bottom: 1px solid #263254; }
  .section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 8px; }
  .section h2.h2row { display: flex; align-items: center; justify-content: space-between; }
  .spoilrow { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; text-transform: none; letter-spacing: 0; color: #cfe6ff; cursor: pointer; user-select: none; font-weight: 600; }
  .spoilrow input { appearance: none; -webkit-appearance: none; margin: 0; width: 36px; height: 20px; border-radius: 999px; background: #2a3860; border: 1px solid #3a4a7e; position: relative; cursor: pointer; flex: none; transition: background 0.15s, border-color 0.15s; }
  .spoilrow input::before { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 999px; background: #cfe6ff; box-shadow: 0 1px 2px rgba(0,0,0,0.5); transition: left 0.15s, background 0.15s; }
  .spoilrow input:checked { background: var(--accent); border-color: var(--accent); }
  .spoilrow input:checked::before { left: 18px; background: #fff; }
  /* Spoil : masqués par défaut (body.nospoil), révélés par le toggle du panneau */
  body.nospoil .spoil { display: none !important; }
  #selmap { font-size: 24px; font-weight: 800; color: #fff; margin: 0 0 10px; letter-spacing: 0.5px; }
  .legend-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; user-select: none; }
  .legend-row .dot { width: 14px; height: 14px; border-radius: 999px; flex: none; border: 2px solid rgba(0,0,0,0.6); }
  .legend-row.off .dot { opacity: 0.25; }
  .legend-row.off .lab { text-decoration: line-through; color: var(--muted); }
  .legend-row .lab { font-size: 13px; flex: 1; }
  .legend-row .cnt { font-size: 11px; color: var(--muted); }
  #poi-tip {
    position: absolute; z-index: 30; width: 250px;
    background: #141d38; border: 1px solid #3a4a7e; border-top: 3px solid var(--warp);
    border-radius: 10px; padding: 10px 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.55);
    font-size: 13px; display: none;
  }
  #poi-tip h3 { display: flex; align-items: center; gap: 8px; margin: 4px 0 2px; font-size: 15px; }
  #poi-tip img.itic { width: 32px; height: 32px; image-rendering: pixelated; background: #efe6f2; border-radius: 6px; padding: 2px; flex: none; }
  #poi-tip .chip {
    display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
    text-transform: uppercase; color: #fff; border-radius: 8px; padding: 2px 8px;
  }
  #poi-tip .coords { color: var(--muted); font-size: 11px; margin: 2px 0 4px; }
  #poi-tip .don { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #ffb37a; margin: 4px 0 0; }
  #poi-tip .team { font-size: 12px; color: #cfe6ff; margin: 4px 0 0; }
  #poi-tip .tlabel { font-size: 11px; font-weight: 700; color: white; text-transform: uppercase; letter-spacing: 0.5px; margin: 8px 0 0; }
  #poi-tip h3.shop { margin: 12px 0 2px; }
  #poi-tip img.pd { width: 14px; height: 14px; image-rendering: pixelated; vertical-align: -2px; margin-left: 3px; }
  #poi-tip .ou { color: var(--muted); font-size: 11px; }
  #poi-tip .teamlist li { display: flex; align-items: center; gap: 6px; }
  #poi-tip .teamlist .tnm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #poi-tip .teamlist .lv { flex: 0 0 auto; margin-left: auto; white-space: nowrap; }
  #poi-tip .shoplist li { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  #poi-tip .shoplist .lv { margin-left: auto; white-space: nowrap; }
  #poi-tip .tradelist .vs { justify-content: center; color: white; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  #poi-tip p { font-size: 13px; color: var(--muted); margin: 6px 0; line-height: 1.45; }
  #poi-tip ul { margin: 6px 0; padding-left: 2px; list-style: none; }
  #poi-tip li { font-size: 13px; margin: 4px 0; }
  img.mon { image-rendering: pixelated; background: #fff; border-radius: 6px; padding: 2px; }
  #poi-tip img.mon { height: 48px; vertical-align: middle; margin-right: 5px; }
  .wildrow img.mon { height: 48px; }
  #poi-tip .lv { color: var(--muted); }
  /* Les sources restent dans le DOM de l'infobulle (debug, inspecteur)
     sans s'afficher. */
  #poi-tip .src { display: none; font-size: 10.5px; color: #5f6f99; margin-top: 10px; word-break: break-all; }
  #poi-tip .close {
    position: absolute; top: 6px; right: 8px; border: none; background: none;
    color: var(--muted); font-size: 13px; cursor: pointer; padding: 2px 4px;
  }
  #poi-tip .close:hover { color: #fff; }
  #poi-tip.go { cursor: pointer; }
  #poi-tip.go:hover { border-color: var(--accent); }
  #poi-tip h3 .arrow { margin-left: auto; color: var(--accent); font-weight: 700; font-size: 16px; }
  .wildrow { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 3px 0; border-bottom: 1px dashed #263254; }
  .wildrow:last-child { border-bottom: none; }
  .wildrow .rng { display: flex; align-items: baseline; gap: 8px; color: var(--muted); margin-left: auto; padding-left: 8px; }
  .wildrow .rng .lvl, .wildrow .rng .pct { white-space: nowrap; }
  .wildrow .wname { display: flex; align-items: center; gap: 6px; }
  .ftool { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: #fff; margin: 10px 0 2px; }
  .catico { width: 22px; height: 22px; border-radius: 50%; background: #fff; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .catico img { width: 16px; height: 16px; image-rendering: pixelated; display: block; }
  .fnote { font-size: 11px; color: var(--muted); margin: 6px 0 0; line-height: 1.45; }
  /* ---------- écran de chargement ---------- */
  #loader { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 13px; background: var(--bg);
    color: var(--text); transition: opacity .45s ease; }
  #loader.off { opacity: 0; pointer-events: none; }
  #loader .pokeball { width: 62px; height: 62px; border-radius: 50%;
    border: 4px solid #0b1020;
    background: linear-gradient(#e3350d 0 45%, #0b1020 45% 55%, #f8f8f8 55% 100%);
    position: relative; animation: pb-spin .9s linear infinite; }
  #loader .pokeball::after { content: ""; position: absolute; left: 50%; top: 50%;
    width: 17px; height: 17px; border-radius: 50%; background: #f8f8f8;
    border: 4px solid #0b1020; transform: translate(-50%, -50%); box-sizing: border-box; }
  @keyframes pb-spin { to { transform: rotate(360deg); } }
  #loader .ltitle { font-size: 19px; font-weight: 600; letter-spacing: .5px; }
  #loader .ltext { color: var(--muted); font-size: 14px; }
  #loader .lbar { width: 300px; max-width: 70vw; height: 6px; border-radius: 3px;
    background: var(--panel2); overflow: hidden; }
  #loader .lbar i { display: block; height: 100%; width: 0%;
    background: var(--accent); transition: width .25s; }
  #loader .lcount { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #netbanner { position: fixed; right: 14px; bottom: 14px; z-index: 9998; max-width: 320px;
    background: var(--panel2); border: 1px solid #e3350d; border-radius: 8px;
    padding: 10px 14px; font-size: 13px; color: var(--text); line-height: 1.45; }
  #netbanner button { position: absolute; top: 4px; right: 8px; border: 0; cursor: pointer;
    font-size: 15px; color: var(--muted); background: none; }
</style>
</head>
<body class="nospoil">
<header>
  <h1><span class="pkm">Pokémon Version Violette</span></h1>
  <h1 id="mapname">Monde</h1>
  <nav id="pages">
    <button type="button" data-page="monde">Monde</button>
    <div class="dd" id="dd-interieur">
      <button type="button">Intérieurs <span class="car">▼</span></button>
      <div class="ddmenu"></div>
    </div>
    <div class="dd" id="dd-donjon">
      <button type="button">Donjons <span class="car">▼</span></button>
      <div class="ddmenu"></div>
    </div>
    <div class="dd" id="dd-objets">
      <button type="button">Objets clés <span class="car">▼</span></button>
      <div class="ddmenu"></div>
    </div>
    <div class="dd" id="dd-succes">
      <button type="button">Succès <span class="car">▼</span></button>
      <div class="ddmenu"></div>
    </div>
    <button type="button" id="paneltoggle" title="Replier le menu de droite"><span class="car">»</span></button>
  </nav>
  
</header>
<div id="layout">
  <div id="viewport">
    <div id="zoombar">
      <button id="zin" title="Zoomer">+</button>
      <button id="zout" title="Dézoomer">−</button>
      <button id="zfit" class="fit" title="Ajuster">Ajuster</button>
    </div>
    <!-- t75 : structure hiérarchique du DOM, lisible par un humain :
         #stage > div.page (une par page : Monde, puis chaque groupe
         Intérieurs/Donjons) > div.maplayer (une par carte, avec sa capture
         img) > div.mtype (un par type de contenu : pnj, vendeur, trainer,
         item, hidden, warp) > div.marker (le contenu lui-même).
         Les pages, cartes et types sont créés par le JS (buildPages,
         buildLayers, buildMarkers). -->
    <div id="stage"></div>
    <div id="zoomlevel">100 %</div>
    <div id="poi-tip"></div>
  </div>
  <aside id="panel">
    <div class="section" id="legendbox">
      <h2 class="h2row">Légende <label class="spoilrow" for="spoiltoggle" title="Afficher les spoilers : zones secrètes, duels cachés, Mew…">Spoil <input type="checkbox" id="spoiltoggle"></label></h2>
      <div id="legend"></div>
    </div>
    <div class="section">
      <h2>Rencontres sauvages</h2>
      <div id="selmap"></div>
      <div id="wild"></div>
    </div>
  </aside>
</div>

<script>

var B85A="0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz!#$%&()*+-;<=>?@^_`{|}~";
var B85D=null;
const FALLBACK_PNG = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABBAMAAADtO9m6AAAAA1BMVEWIiIhYZW6zAAAACklEQVR42mNgAAAAAgAB5Sfe/AAAAABJRU5ErkJggg==";
function SRC(v){ if (typeof v === "string" && v.slice(0, 4) === "http") return v; return "data:image/png;base64," + v; }
const LOADER = { el: null, num: null, den: null, bar: null, text: null, total: 0, n: 0, fail: 0, t0: Date.now() };
(function () {
  const d = document.createElement("div");
  d.id = "loader";
  d.innerHTML = '<div class="pokeball"></div>'
    + '<div class="ltitle">Pokémon Version Violette — carte interactive</div>'
    + '<div class="ltext">Chargement des images du dépôt GitHub…</div>'
    + '<div class="lbar"><i id="lbarf"></i></div>'

LOADER.paint = function () {
  if (this.num) this.num.textContent = this.n;
  if (this.den) this.den.textContent = this.total;
  if (this.bar) this.bar.style.width = (this.total ? Math.round(100 * this.n / this.total) : 0) + "%";
};
LOADER.tick = function () { this.n++; this.paint(); };
LOADER.hide = function () {
  if (!this.el) return;
  const el = this.el, wait = Math.max(0, 700 - (Date.now() - this.t0));
  const blocked = this.total > 8 && this.fail >= this.total - 8;
  if (blocked) {
    if (this.text) this.text.innerHTML = "Images bloquées dans ce cadre intégré :<br>télécharge la page et ouvre-la dans ton navigateur.";
    if (this.bar) this.bar.style.background = "#e3350d";
  }
  setTimeout(() => {
    el.classList.add("off");
    setTimeout(() => { el.remove(); LOADER.notice(blocked); }, 500);
  }, blocked ? 2600 : wait);
};
LOADER.notice = function (blocked) {
  if (!blocked) return;
  const b = document.createElement("div");
  b.id = "netbanner";
  b.innerHTML = "⚠ Images distantes bloquées ici : panneau = aperçu limité.<br>Télécharge la page pour l'affichage complet.";
  const x = document.createElement("button");
  x.textContent = "×";
  x.onclick = () => b.remove();
  b.appendChild(x);
  (document.body || document.documentElement).appendChild(b);
};
/* Cache d'images distantes : un seul téléchargement par URL, compté une fois. */
const IMGCACHE = new Map();
function loadURL(url) {
  if (!IMGCACHE.has(url)) {
    LOADER.total++;
    const p = new Promise(res => {
      const g = new Image();
      g.crossOrigin = "anonymous";
      g.onload = () => { LOADER.tick(); res(g); };
      g.onerror = () => {
        LOADER.fail++;
        const f = new Image();
        f.onload = () => { LOADER.tick(); res(f); };
        f.src = FALLBACK_PNG;
      };
      g.src = url;
    });
    IMGCACHE.set(url, p);
  }
  return IMGCACHE.get(url);
}

function loadB64(b64) {
  const src = SRC(b64);
  if (src.slice(0, 4) === "http") return loadURL(src);
  return new Promise((res) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => { const f = new Image(); f.onload = () => res(f); f.src = FALLBACK_PNG; };
    i.src = src;
  });
}
async function recolor(b64, pal, frame, yoff = 0, mirror = false, idxPal = null) {
  const img = await loadB64(b64);
  const w = frame ? Math.min(16, img.width) : img.width;
  const h = frame ? Math.min(16, img.height - yoff) : img.height;
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  if (mirror) { ctx.translate(w, 0); ctx.scale(-1, 1); }
  ctx.drawImage(img, 0, yoff, w, h, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h);
  const px = d.data;
  for (let i = 0; i < px.length; i += 4) {
    // Fronts PNG indexés couleur : après drawImage l'index de palette est
    // perdu, on mappe par couleur exacte, équivalente aux niveaux de gris
    // 170 (teinte cA -> pal[0]) et 85 (teinte cB -> pal[1]) des fronts 2 bits.
    let lum = px[i];
    if (idxPal) {
      const c = idxPal[px[i] + "," + px[i + 1] + "," + px[i + 2]];
      if (c === 0) { lum = 170; }
      else if (c === 1) { lum = 85; }
    }
    if (lum >= 240) { px[i + 3] = 0; }
    else {
      const col = lum >= 140 ? pal[0] : (lum >= 60 ? pal[1] : pal[2]);
      px[i] = col[0]; px[i + 1] = col[1]; px[i + 2] = col[2]; px[i + 3] = 255;
    }
  }
  ctx.putImageData(d, 0, 0);
  return c.toDataURL("image/png");
}

/* ---------- Structure hiérarchique du DOM ----------
   #stage
     +- div.page         : LA div au plus haut, une par page (Monde puis
     |                     une par groupe zone|groupe, data-page)
     |   +- div.maplayer : une carte par page (classe spoil si secrète)
     |       +- img        : la capture de la carte
     |       +- div.mtype  : un par type de contenu, ordre de la légende
     |           +- div.marker : le contenu lui-même, en cases de la carte
   Pages et cartes créées ici, marqueurs dans buildMarkers. */
const stg = document.getElementById("stage");
const PAGE_ELS = {};
["monde"].concat(Object.keys(GROUP_OFFSETS)).forEach(pk => {
  const pd = document.createElement("div");
  pd.className = "page";
  pd.dataset.page = pk === "monde" ? "monde" : "g:" + pk;
  stg.appendChild(pd);
  PAGE_ELS[pk] = pd;
});
const pageKeyOf = m => m.zone === "monde" ? "monde" : m.zone + "|" + m.group;
let stageW = 0, stageH = 0;
MAPS.forEach(m => {
  const layer = document.createElement("div");
  layer.className = "maplayer" + (m.spoil ? " spoil" : "");
  layer.dataset.map = m.id;
  layer.style.width = m.w + "px";
  layer.style.height = m.h + "px";
  const im = document.createElement("img");
  im.crossOrigin = "anonymous";
  im.onerror = () => { im.onerror = null; im.src = FALLBACK_PNG; };
  const src = SRC(m.b64);
  if (src.slice(0, 4) === "http") loadURL(src).then(g => { im.src = g.src; });
  else im.src = src;
  im.draggable = false;
  im.alt = m.label;
  layer.appendChild(im);
  m.el = layer;
  PAGE_ELS[pageKeyOf(m)].appendChild(layer);
});

/* ---------- pages : Monde = surface collée ; Intérieurs / Donjons = une
   page par groupe de lieu. Seule la page courante est affichée et cliquable. ---------- */
let page = "monde";
const pageMaps = () => page === "monde" ? MAPS.filter(m => m.zone === "monde") :
  MAPS.filter(m => m.zone + "|" + m.group === page.slice(2));
function layoutPage() {
  const ms = pageMaps();
  stageW = 0; stageH = 0;
  MAPS.forEach(m => {
    m.onPage = ms.includes(m);
    m.el.style.display = m.onPage ? "" : "none";
    if (!m.onPage) return;
    const off = page === "monde" ? WORLD_OFFSETS[m.id] : GROUP_OFFSETS[page.slice(2)][m.id];
    m.left = off[0] * TILE;
    m.top = off[1] * TILE;
    m.el.style.left = m.left + "px";
    m.el.style.top = m.top + "px";
    stageW = Math.max(stageW, m.left + m.w);
    stageH = Math.max(stageH, m.top + m.h);
  });
  stg.style.width = stageW + "px";
  stg.style.height = stageH + "px";
  /* Marqueurs imbriqués dans leur carte, positionnés une seule fois
     à la construction ; seule la page affichée change la visibilité. */
  Object.keys(PAGE_ELS).forEach(k =>
    PAGE_ELS[k].style.display = (k === "monde" ? "monde" : "g:" + k) === page ? "" : "none");
  refreshMarkers();
}
function showPage(p, noFit) {
  page = p;
  closeTip();
  layoutPage();
  document.querySelectorAll("#pages button").forEach(b => b.classList.remove("active"));
  if (page === "monde") {
    document.querySelector('#pages [data-page="monde"]').classList.add("active");
    document.getElementById("mapname").textContent = "Monde";
  } else {
    const key = page.slice(2);
    document.querySelector("#dd-" + key.split("|")[0] + " > button").classList.add("active");
    const it = document.querySelector('.grp[data-page="' + page + '"]');
    if (it) it.classList.add("active");
    document.getElementById("mapname").textContent = GROUP_LABELS[key] || key.split("|")[1];
  }
  if (!selMap || !selMap.onPage) selectMap(pageMaps()[0]);
  if (!noFit) fit();
}

/* ---------- menu du haut : bouton Monde + listes déroulantes groupées ---------- */
document.querySelector('#pages [data-page="monde"]').onclick = () => showPage("monde");
["interieur", "donjon"].forEach(zone => {
  const dd = document.getElementById("dd-" + zone);
  const menu = dd.querySelector(".ddmenu");
  const groups = [];
  MAPS.filter(m => m.zone === zone).forEach(m => {
    let g = groups.find(x => x.name === m.group);
    if (!g) groups.push(g = { name: m.group, maps: [] });
    g.maps.push(m);
  });
  /* Ordre des menus - Intérieurs : villes (alphabétique), puis routes
     (numérique), puis autres (alphabétique) ; Donjons : alphabétique.
     Groupes satellites placés juste après leur ville - Céladopole ->
     Casino Rocket, Centre commercial, Manoir Céladon ; Safrania -> Postes
     de garde Safrania (clé de tri "ville + label", ils suivent leur ville
     dans l'ordre alphabétique et passent devant la ville suivante). */
  const VILLES = ["Argenta", "Azuria", "Bourg Palette", "Carmin sur Mer", "Céladopole", "Cramois'Île", "Jadielle", "Lavanville", "Parmanie", "Safrania"];
  const glabel = g => GROUP_LABELS[zone + "|" + g.name] || g.name;
  const SATELLITES = { "Céladopole": ["Casino Rocket", "Centre commercial", "Manoir Céladon"], "Safrania": ["Postes de garde Safrania"], "Azuria": ["Villa Léo"] };
  const maitre = g => { for (const v in SATELLITES) if (SATELLITES[v].includes(g.name)) return v; return null; };
  const cleTri = g => maitre(g) ? maitre(g) + " " + glabel(g) : glabel(g);
  groups.sort((a, b) => {
    if (zone === "donjon") return glabel(a).localeCompare(glabel(b), "fr");
    const rank = g => (maitre(g) || VILLES.includes(g.name)) ? 0 : /^Route/.test(glabel(g)) ? 1 : 2;
    if (rank(a) !== rank(b)) return rank(a) - rank(b);
    if (rank(a) === 1) {
      const num = g => parseInt((glabel(g).match(/[0-9]+/) || ["0"])[0], 10);
      return num(a) - num(b) || glabel(a).localeCompare(glabel(b), "fr");
    }
    return cleTri(a).localeCompare(cleTri(b), "fr");
  });
  groups.forEach(g => {
    const key = zone + "|" + g.name;
    const gh = document.createElement("button");
    gh.type = "button";
    gh.className = "grp";
    gh.dataset.page = "g:" + key;
    gh.textContent = GROUP_LABELS[key] || g.name;
    gh.onclick = e => { e.stopPropagation(); dd.classList.remove("open"); showPage("g:" + key); };
    menu.appendChild(gh);
  });
});

document.querySelectorAll(".dd > button").forEach(btn => {
  btn.onclick = e => {
    e.stopPropagation();
    document.querySelectorAll(".dd").forEach(d => { if (d !== btn.parentElement) d.classList.remove("open"); });
    btn.parentElement.classList.toggle("open");
  };

document.addEventListener("click", () => document.querySelectorAll(".dd").forEach(d => d.classList.remove("open")));

/* Le bouton collapse en fin de nav replie le menu de droite (Légende /
   Rencontres) : classe body.panelhide, la zone des cartes récupère les
   320 px. L'icône bascule entre » (menu déployé, action = replier) et
   « (menu replié, action = déplier), le titre suit. */
document.getElementById("paneltoggle").onclick = () => {

  b.querySelector(".car").textContent = hidden ? "«" : "»";
};

/* ---------- zoom / pan ---------- */
const vp = document.getElementById("viewport");
const stage = document.getElementById("stage");
let z = 1, ox = 0, oy = 0;
const tip = document.getElementById("poi-tip");
let tipFor = null;
tip.addEventListener("pointerdown", e => e.stopPropagation());
document.addEventListener("keydown", e => { if (e.key === "Escape") closeTip(); });

function apply() {
  stage.style.transform = "translate(" + ox + "px," + oy + "px) scale(" + z + ")";
  stage.style.setProperty("--z", z);
  document.getElementById("zoomlevel").textContent = Math.round(z * 100) + " %";
  placeTip();
}
function fit() {
  const r = vp.getBoundingClientRect();
  z = Math.min(2, Math.min(r.width / stageW, r.height / stageH) * 0.96);
  ox = (r.width - stageW * z) / 2;
  oy = (r.height - stageH * z) / 2;
  apply();
}
function zoomAt(cx, cy, factor) {
  const nz = Math.min(2, Math.max(0.4, z * factor));
  const k = nz / z;
  ox = cx - (cx - ox) * k;
  oy = cy - (cy - oy) * k;
  z = nz;
  apply();
}
document.getElementById("zin").onclick = () => { cancelAnim(); const r = vp.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 1.25); };
document.getElementById("zout").onclick = () => { cancelAnim(); const r = vp.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 0.8); };
document.getElementById("zfit").onclick = () => { cancelAnim(); fit(); };
vp.addEventListener("wheel", e => {
  e.preventDefault();
  cancelAnim();
  const r = vp.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 0.89);
}, { passive: false });
let drag = null;
vp.addEventListener("pointerdown", e => {
  /* Pendant un déplacement caméra (gotoMap, 500 ms), la prise de drag
     est bloquée et les clics inertes le temps du vol ; la molette et les
     boutons de zoom gardent la main (ils annulent le vol eux-mêmes). */
  if (anim) return;
  cancelAnim();
  drag = { x: e.clientX, y: e.clientY, ox, oy, moved: false,
           target: e.target && e.target.closest ? e.target.closest(".marker") : null };
  vp.classList.add("dragging");
  vp.setPointerCapture(e.pointerId);
});
vp.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  ox = drag.ox + dx; oy = drag.oy + dy;
  apply();
});
vp.addEventListener("pointerup", e => {
  vp.classList.remove("dragging");
  if (drag && !drag.moved) {
    if (drag.target) {
      const m = MARKERS.find(mm => mm.el === drag.target);
      if (m) openTip(m, drag.target); else closeTip();
    } else {
      closeTip();
      const r = vp.getBoundingClientRect();
      const sx = (e.clientX - r.left - ox) / z;
      const sy = (e.clientY - r.top - oy) / z;
      const hit = MAPS.find(m => m.onPage && !(m.spoil && document.body.classList.contains("nospoil")) && sx >= m.left && sx < m.left + m.w && sy >= m.top && sy < m.top + m.h);
      if (hit) selectMap(hit);
    }
  }
  drag = null;
});
vp.addEventListener("pointercancel", () => { vp.classList.remove("dragging"); drag = null; });
/* double-clic sur un marqueur de warp (badge bleu) = téléportation directe,
   même action que le lien de l'infobulle */
vp.addEventListener("dblclick", e => {
  /* NB : setPointerCapture (pointerdown) re-cible les evenements souris sur le
     viewport, donc e.target est #viewport et non la pastille — on teste
     l'element reellement sous le curseur */
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const t = under && under.closest ? under.closest(".marker") : null;
  if (!t) return;
  const m = MARKERS.find(mm => mm.el === t);
  if (m && m.cat === "warp") { const d = mapFromName(m.name); if (d) gotoMap(d, m); }
});
window.addEventListener("resize", fit);
fit();

/* ---------- marqueurs ---------- */
const visible = { pnj: true, vendeur: true, trainer: true, item: true, hidden: true, warp: true };
const HS_VISIBLES = ["Rival", "Ho-Oh"]; // RÈGLE HS : toute entrée Hide de data/maps/hide_show_data.asm (= invisible au début du jeu, drapeau armé à l'init) → marqueur hs:"cache" ; seules les exceptions TOUJOURS_VISIBLIBLES de mark_visible_objects.py (rivaux, Mew du quai de Vermillon, Ho-Oh du jardin... : ce tableau, par name) restent affichées. Hide non listé = caché ; Show = visible au départ puis retiré par script → pas de tag.
const hsVisible = m => !m.hs || HS_VISIBLES.includes(m.name);

function buildMarkers() {
  /* Un div.mtype par type de contenu de la carte, dans l'ordre de la
     légende (pnj, vendeur, trainer, item, hidden, warp) ; chaque marqueur
     vit dans le type de contenu de sa carte : la carte > le type > le
     contenu. Conteneurs créés seulement pour les types réellement présents
     (et visibles au départ, règle HS). */
  MAPS.forEach(mp => {
    mp.types = {};
    Object.keys(CATS).filter(tk =>
      (mp.markers || []).some(m => hsVisible(m) && (m.shop ? "vendeur" : m.cat) === tk)
    ).forEach(tk => {
      const tEl = document.createElement("div");
      tEl.className = "mtype " + tk;
      tEl.dataset.type = tk;
      mp.el.appendChild(tEl);
      mp.types[tk] = tEl;
    });
  });
  MAPS.forEach(mp => (mp.markers || []).forEach(m => {
    m.mp = mp;
    if (!hsVisible(m)) return; // HS caché au début du jeu : pas affiché
    const el = document.createElement("div");
    /* Un warp vers une carte spoil est masqué comme elle ; tout marqueur
       posé sur une carte spoil est masqué comme elle (warps, objets, PNJ) :
       une carte masquée masque aussi ses marqueurs. Les classes spoil des
       marqueurs restent nécessaires pour les warps pointant vers une carte
       spoil depuis une carte visible (spoilDest) et pour les marqueurs
       spoil isolés. */
    const spoilDest = m.cat === "warp" && !!mapFromName(m.name) && mapFromName(m.name).spoil;
    el.className = "marker" + (m.give ? " don" : "") + ((m.spoil || spoilDest || mp.spoil) ? " spoil" : "");
    el.style.left = (m.x * TILE + TILE / 2) + "px"; /* relatif à la carte */
    el.style.top = (m.y * TILE + TILE / 2) + "px";
    if (m.cat === "hidden") { // objet caché : badge à l'icône, homogène au don
      const b = document.createElement("span");
      b.className = "hiddenico";
      b.innerHTML = '<img src="' + ICONS[m.tipIcon] + '" alt="">';
      el.appendChild(b);
    } else if (m.spr) {
      const im = document.createElement("img");
      im.className = "spr " + (m.shop ? "vendeur" : m.cat);
      im.src = ICONS[m.dir ? m.icon + "_" + m.dir : m.icon] || ICONS[m.icon];
      im.draggable = false;
      el.appendChild(im);
      if (m.tipIcon && m.ballMini) {
        const bm = document.createElement("span");
        bm.className = "ballico";
        bm.innerHTML = '<img src="' + ICONS[m.tipIcon] + '" alt="">';
        el.appendChild(bm);
      }
    } else if (m.shop) {
      /* comptoir de vente sans sprite : logo P$ + rond transparent cliquable */
      const h = document.createElement("span");
      h.className = "hitrond";
      el.appendChild(h);
    } else {
      const b = document.createElement("span");
      b.className = "badge " + m.cat;
      b.textContent = m.badge;
      el.appendChild(b);
    }
    if (m.give) {
      const gi = document.createElement("span");
      gi.className = "giveico";
      gi.innerHTML = '<img src="' + ICONS[m.give[0]] + '" alt="">';
      el.appendChild(gi);
    }
    if (m.trade) {
      const ti = document.createElement("span");
      ti.className = "giveico";
      ti.innerHTML = '<img src="' + ICONS["front_" + m.trade[0]] + '" alt="">';
      el.appendChild(ti);
    }
    if (m.shop) {
      const si = document.createElement("span");
      si.className = "shopico";
      si.innerHTML = '<img src="' + ICONS["pokedollar"] + '" alt="">';
      el.appendChild(si);
    }
    el.title = m.name + (m.shop ? "\nMagasin : " + m.shop.map(s => s[1] + " " + s[2] + " " + (s[3] || "P$")).join(", ") : "")
      + (m.trade ? "\nÉchange : " + m.trade[1] + " contre " + m.trade[3] : "");
    m.el = el;
    (mp.types[m.shop ? "vendeur" : m.cat] || mp.el).appendChild(el);
  }));
}

function refreshMarkers() {
  MARKERS.forEach(m => { if (m.el) m.el.style.display = (m.mp.onPage && visible[m.shop ? "vendeur" : m.cat]) ? "" : "none"; });
}

/* ---------- légende ---------- */
const legendEl = document.getElementById("legend");
Object.entries(CATS).forEach(([key, c]) => {
  const n = MARKERS.filter(m => (m.shop ? "vendeur" : m.cat) === key && hsVisible(m)).length;
  const row = document.createElement("div");
  row.className = "legend-row";

    '<span class="lab">' + c.label + '</span><span class="cnt">' + n + "</span>";

    visible[key] = !visible[key];
    row.classList.toggle("off", !visible[key]);
    refreshMarkers();

});

/* ---------- infobulle ---------- */
function openTip(m, el) {
  MARKERS.forEach(o => { if (o.el) o.el.classList.remove("sel"); });
  el.classList.add("sel");
  tipFor = m;
  selectMap(m.mp);
  const c = CATS[m.shop ? "vendeur" : m.cat];
  let html = '<span class="chip" style="background:' + c.color + '">' + c.chip + "</span>";
  html += '<button class="close" title="Fermer">✕</button>';
  const dest = m.cat === "warp" ? mapFromName(m.name) : null;
  const nm = m.cat === "warp" && m.dx !== undefined ? m.name + " (" + m.dx + ", " + m.dy + ")" : m.name;
  html += "<h3>" + (m.tipIcon ? '<img class="itic" src="' + ICONS[m.tipIcon] + '" alt="">' : "") + nm + (dest ? '<span class="arrow">→</span>' : "") + "</h3>";
  html += '<p class="coords">Case (' + m.x + ", " + m.y + ")</p>";
  if (m.give) {
    html += '<p class="don"><img class="itic" src="' + ICONS[m.give[0]] + '">Donne : ' + m.give[1] + "</p>";
  }
  const teamHtml = (t, label) => {
    let h = label ? '<p class="tlabel">' + label + "</p>" : "";
    h += '<ul class="teamlist">' + t.map(e => Array.isArray(e[0]) ? e.map((u, i) =>
      '<li>' + (i ? '<span class="ou">ou </span>' : "") + '<img class="mon" src="' + ICONS["front_" + u[0]] + '">' +
      '<span class="tnm">' + u[1] + '</span><span class="lv">n. ' + u[2] + "</span></li>").join("") :
      '<li><img class="mon" src="' + ICONS["front_" + e[0]] + '">' +
      '<span class="tnm">' + e[1] + '</span><span class="lv">n. ' + e[2] + "</span></li>").join("") + "</ul>";
    return h;
  };
  const teamHtmlSp = (t, label) => '<div class="spoil">' + teamHtml(t, label) + '</div>'; // t70 : 2e duel spoil
  if (m.teams) {
    m.teams.forEach(te => { html += /^Revanche/.test(te[0]) ? teamHtmlSp(te[1], te[0]) : teamHtml(te[1], te[0]); });
  }
  if (m.team || m.team2) {
    if (m.team) html += teamHtml(m.team, m.team2 ? "1ère rencontre" : null);
    if (m.team2) html += m.spoil2 ? teamHtmlSp(m.team2, m.t2label || "Revanche") : teamHtml(m.team2, "2ème rencontre");
  }
  if (m.trade) {
    html += '<h3 class="shop">Échange :</h3><ul class="shoplist tradelist"><li><img class="mon" src="' +
      ICONS["front_" + m.trade[0]] + '">' + m.trade[1] + '</li><li class="vs">contre</li><li><img class="mon" src="' +
      ICONS["front_" + m.trade[2]] + '">' + m.trade[3] + "</li></ul>";
  }
  if (m.cable) {
    html += '<h3 class="shop">Échange :</h3><ul class="shoplist"><li>Échange de Pokémon avec un autre joueur (Cable Club)</li></ul>';
  }
  if (m.shop) {
    html += '<h3 class="shop">Magasin :</h3><ul class="shoplist">' + m.shop.map(s =>
      '<li><img class="itic" src="' + ICONS[s[0]] + '">' + s[1] +
      ' <span class="lv">' + s[2] + (s[3] ? " " + s[3] : typeof s[2] === "number" ? ' <img class="pd" src="' + ICONS["pokedollar_white"] + '" alt="P$">' : "") + "</span></li>").join("") + "</ul>";
  }
  html += '<p class="src">Sources : data/maps/objects/' + m.mp.id + '.asm' +
    ((m.team || m.teams) ? ", data/battle/trainer_parties.asm" : "") +
    (m.cat === "hidden" ? ", data/items/hidden_objects.asm" : "") +
    ((m.give || m.trade || m.cable || m.scripted) ? ", scripts/" + m.mp.id + ".asm" : "")
    + (m.trade ? ", data/pokemons/trades.asm" : "")
    + (m.shop && !m.scripted ? ", data/items/mart_inventories.asm, item_prices.asm, tm_prices.asm" : "") + "</p>";
  tip.innerHTML = html;
  tip.style.borderTopColor = c.color;
  tip.querySelector(".close").onclick = e => { e.stopPropagation(); closeTip(); };
  tip.classList.toggle("go", !!dest);
  tip.onclick = dest ? () => gotoMap(dest, m) : null;
  placeTip();
}
function closeTip() {
  MARKERS.forEach(o => { if (o.el) o.el.classList.remove("sel"); });
  tipFor = null;
  tip.style.display = "none";
}
function placeTip() {
  if (!tipFor) return;
  const r = vp.getBoundingClientRect();
  const cx = ox + (tipFor.mp.left + tipFor.x * TILE + TILE / 2) * z;
  const upY = oy + (tipFor.mp.top + tipFor.y * TILE + TILE / 2 - (tipFor.spr ? 34 : 12)) * z;
  const downY = oy + (tipFor.mp.top + tipFor.y * TILE + TILE / 2 + (tipFor.spr ? 10 : 12)) * z;
  tip.style.display = "block";
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  const left = Math.max(tw / 2 + 4, Math.min(r.width - tw / 2 - 4, cx));
  let top, tf;
  if (upY - th - 4 >= 0) { top = upY - 4; tf = "translate(-50%, -100%)"; }
  else { top = downY + 4; tf = "translate(-50%, 0)"; }
  tip.style.left = left + "px";
  tip.style.top = top + "px";
  tip.style.transform = tf;
}
/* Préchargement parallèle de toutes les images distantes (cartes + sprites),
   puis révélation de l'application une fois recoloration et mise en page terminées. */
function preloadAll() {
  const urls = new Set();
  for (const d of [ICONS_B64, FRONT_B64])
    for (const k in d) { const v = d[k]; if (typeof v === "string" && v.slice(0, 4) === "http") urls.add(v); }
  MAPS.forEach(m => { const v = SRC(m.b64); if (v.slice(0, 4) === "http") urls.add(v); });
  return Promise.allSettled(Array.from(urls).map(loadURL));
}
const loadReady = preloadAll();
const appReady = buildIcons().then(() => { buildMarkers(); buildObjets(); buildSucces(); showPage("monde"); selectMap(RT1); });
Promise.all([appReady, loadReady]).then(() => LOADER.hide());

/* ---------- rencontres (carte sélectionnée par clic) ---------- */
const wildEl = document.getElementById("wild");
let selMap = null;
function selectMap(m) {
  if (selMap === m) return;
  if (selMap) selMap.el.classList.remove("sel");
  selMap = m;
  m.el.classList.add("sel");
  document.getElementById("selmap").textContent = m.label;
  renderWild(m);
}
function ftool(label) {
  const ic = { "Terrestre": "grass", "Surf": "surf", "Canne": "old_rod", "Super Canne": "good_rod", "Méga Canne": "super_rod" }[label];
  return '<div class="ftool">' + (ic && ICONS[ic] ? '<span class="catico"><img src="' + ICONS[ic] + '" alt=""></span>' : '') + label + '</div>';
}
/* Panneau Rencontres : seules les sections qui ont des rencontres
   disponibles s'affichent, avec leurs propres libellés (Terrestre /
   Surf / cannes) ; si la carte n'a aucune rencontre du tout, le panneau
   affiche un footer fnote d'absence. Niveaux et pourcentages en 2
   colonnes alignées à droite (lvl collé au pct : le pourcentage garde
   toujours la même place). */
function renderWild(m) {
  m = m || selMap || RT1;
  const fish = m.fish || [];
  const surfE = fish.find(t => t[0] === "Surf" && Array.isArray(t[1]));
  const rods = fish.filter(t => t[0] !== "Surf" && t[0] !== "Pêche" && Array.isArray(t[1]));
  const rowHtml = w => '<div class="wildrow"><span class="wname"><img class="mon" src="' + ICONS["front_" + w[0]] + '">' + w[1] + '</span><span class="rng"><span class="lvl">' + w[2] + '</span><span class="pct">' + w[3] + '</span></span></div>';
  let html = "";
  if (m.wild) html += ftool("Terrestre") + m.wild.map(rowHtml).join("");
  if (surfE) html += ftool("Surf") + surfE[1].map(rowHtml).join("");
  if (rods.length) {
    rods.forEach(t => { html += ftool(t[0]) + t[1].map(rowHtml).join(""); });
    html += '<p class="fnote">Listes fixes pour Surf, Canne et Super Canne. <br>Niveaux + 0 à 7 après le badge Cascade.</p>';
  }
  if (!html) html = '<p class="fnote">Aucune rencontres.</p>';
  wildEl.innerHTML = html;
}

/* ---------- navigation : clic sur une sortie → caméra vers la carte liée ---------- */
function mapFromName(name) {
  const dest = name.replace(/^Vers\s+/, "");
  return MAPS.find(m => m.label === dest) || MAPS.find(m => m.label.startsWith(dest)) || null;
}
/* Spoil : les éléments .spoil (marqueurs m.spoil, cartes entières m.spoil)
   sont masqués par défaut (body.nospoil) ; le toggle à droite de Légende les
   révèle. Une téléportation (double-clic ou lien d'infobulle) vers une carte
   spoil active automatiquement le toggle. */
const spoilToggle = document.getElementById("spoiltoggle");
spoilToggle.addEventListener("change", () =>
  document.body.classList.toggle("nospoil", !spoilToggle.checked));
let anim = null;
function cancelAnim() { if (anim) { cancelAnimationFrame(anim); anim = null; } }
function gotoMap(m, warp) {
  if (m.spoil && document.body.classList.contains("nospoil")) {
    document.body.classList.remove("nospoil");
    spoilToggle.checked = true;
  }
  if (!m.onPage) showPage(m.zone === "monde" ? "monde" : "g:" + m.zone + "|" + m.group, true);
  selectMap(m);
  closeTip();
  cancelAnim();
  const r = vp.getBoundingClientRect();
  const tz = Math.min(2, Math.max(0.4, Math.min(r.width / m.w, r.height / m.h) * 0.96));
  const cx = warp && warp.dx !== undefined ? m.left + warp.dx * TILE + TILE / 2 : m.left + m.w / 2;
  const cy = warp && warp.dy !== undefined ? m.top + warp.dy * TILE + TILE / 2 : m.top + m.h / 2;
  const tox = r.width / 2 - cx * tz;
  const toy = r.height / 2 - cy * tz;
  const sz = z, sox = ox, soy = oy, t0 = performance.now(), dur = 500;
  function step(now) {
    let k = Math.min(1, (now - t0) / dur);
    k = 1 - Math.pow(1 - k, 3); // easing ease-out cubic
    z = sz + (tz - sz) * k;
    ox = sox + (tox - sox) * k;
    oy = soy + (toy - soy) * k;
    apply();
    if (k < 1) anim = requestAnimationFrame(step); else anim = null;
  }
  anim = requestAnimationFrame(step);
}
